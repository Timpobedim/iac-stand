# Стартовая конфигурация: сервис ещё не выкатывался. Ansible заменит этот файл при выкате.
server {
    listen 8080;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 503 "no release deployed yet\n";
    }
}
